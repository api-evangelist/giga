aid: giga
name: Giga
description: 'Giga (legal name Giga AI, Inc.; formerly Giga ML) is a San Francisco-based
  agentic AI company that builds human-like voice, chat, and multimodal AI agents for
  high-volume enterprise customer support. Its agents run on a unified real-time
  orchestration layer that listens, reasons, checks connected systems, and responds
  in roughly half a second, resolving issues end to end rather than merely deflecting.
  Agents are built in Agent Canvas, a low-code studio that auto-writes policies from
  uploaded transcripts, and support 90 languages with real-time hallucination
  correction. Backed by Redpoint Ventures, Y Combinator, and Nexus Venture Partners
  (USD 61M Series A); customers include DoorDash, Toast, Postman, and Capital.com.'
